services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    ports:
      - "32400:32400"
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - ./media:/media

volumes:
  plex_config:
    name: plex-config
  plex_transcode:
    name: plex-transcode
