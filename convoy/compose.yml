x-convoy-environment: &convoy-environment
  CONVOY_DB_HOST: postgres
  CONVOY_DB_PORT: 5432
  CONVOY_DB_USERNAME: convoy
  CONVOY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in convoy/.env}
  CONVOY_DB_DATABASE: convoy
  CONVOY_DB_OPTIONS: sslmode=disable&connect_timeout=30
  CONVOY_REDIS_HOST: redis
  CONVOY_REDIS_PORT: 6379
  CONVOY_JWT_SECRET: ${CONVOY_JWT_SECRET:?Set CONVOY_JWT_SECRET in convoy/.env}
  CONVOY_JWT_REFRESH_SECRET: ${CONVOY_JWT_REFRESH_SECRET:?Set CONVOY_JWT_REFRESH_SECRET in convoy/.env}
  CONVOY_HOST: ${CONVOY_HOST:-http://localhost:5005}

services:
  postgres:
    image: postgres:16-alpine
    container_name: convoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: convoy
      POSTGRES_USER: convoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in convoy/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - convoy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoy -d convoy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: convoy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - convoy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: getconvoy/convoy:v26.8.0
    container_name: convoy-migrate
    command: ["migrate", "up", "--config", "/convoy.json"]
    environment: *convoy-environment
    volumes:
      - ./convoy.json:/convoy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  server:
    image: getconvoy/convoy:v26.8.0
    container_name: convoy-server
    restart: unless-stopped
    command: ["server", "--config", "/convoy.json"]
    environment: *convoy-environment
    ports:
      - "5005:5005"
    volumes:
      - ./convoy.json:/convoy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent:
    image: getconvoy/convoy:v26.8.0
    container_name: convoy-agent
    restart: unless-stopped
    command: ["agent", "--config", "/convoy.json"]
    environment: *convoy-environment
    volumes:
      - ./convoy.json:/convoy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5008/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  convoy_postgres:
    name: convoy-postgres-data
  convoy_redis:
    name: convoy-redis-data
